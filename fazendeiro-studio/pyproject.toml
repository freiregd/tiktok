[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fazendeiro-studio"
version = "0.1.0"
description = "Produção local com aprovação humana e orçamento de créditos"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "faster-whisper>=1.1,<2", "av==16.0.1", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
fazendeiro = "farmstudio.cli:main"

[tool.setuptools.package-data]
farmstudio = ["static/*", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
